<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="base :: head('Smart Time Card')">
</head>

<body class="bg-gray-100">

<header th:replace="header :: header">
</header>
<main class="max-w-md mx-auto mt-20 pt-20">
    <h2 class="text-2xl font-bold mb-4 text-center">
        設定
    </h2>
    <form th:action="@{/settings}"
          method="post"
          class="gap-2">
        <h2>休憩時間設定</h2>
        <input
                type="number"
                name="defaultBreakMinutes"
                th:value="${settings.getDefaultBreakMinutes()}"
                min="0"
                step="1"
                class="border rounded px-3 py-2">
        <br><br>
        <h2>通知設定</h2>
        <label>
            <input
                    type="checkbox"
                    name="startNoticeEnabled"
                    th:checked="${settings.startNoticeEnabled}"
                    class="border rounded px-3 py-2">
            出勤通知
            <input
                    type="time"
                    id="startNoticeTime"
                    name="startNoticeTime"
                    th:value="${settings.getStartNoticeTime()}"
                    class="border rounded px-3 py-2">
        </label><br>
        <label>
            <input
                    type="checkbox"
                    name="endNoticeEnabled"
                    th:checked="${settings.endNoticeEnabled}"
                    class="border rounded px-3 py-2">
            退勤通知
            <input
                    type="time"
                    id="endNoticeTime"
                    name="endNoticeTime"
                    th:value="${settings.getEndNoticeTime()}"
                    class="border rounded px-3 py-2">
        </label><br><br>

        <h2>予定時刻</h2>
        <label>開始予定</label>
        <input
                type="time"
                name="startScheduledTime"
                th:value="${settings.getStartScheduledTime()}"
                class="border rounded px-3 py-2">
        <br>
        <label>終了予定</label>
        <input
                type="time"
                name="endScheduledTime"
                th:value="${settings.getEndScheduledTime()}"
                class="border rounded px-3 py-2">
        <br><br>
        <button
            type="submit"
            class="bg-green-600 text-white px-4 py-2 rounded">
            保存
        </button>
    </form>
</main>
</body>
</html>
