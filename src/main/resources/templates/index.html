<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="base :: head('Smart Time Card')">
    <meta charset="UTF-8">
</head>
<body>
    <header th:replace="header :: header">
    </header>
    <main class="max-w-md mx-auto mt-20 pt-20 px-4 text-center">
        <form method="post" class="mt-12 space-y-8">
            <label class="px-2 py-2">
                <input type="radio" name="workType" value="OFFICE" checked>
                出社
            </label>
            <label class="px-2 py-2">
                <input type="radio" name="workType" value="REMOTE">
                在宅
            </label><br><br><br>
            <button formaction="/start" type="submit"
                class="px-6 py-2 bg-green-600 text-white rounded">
                出勤
            </button>
            <button formaction="/end" type="submit"
                    class="px-6 py-2 bg-green-600 text-white rounded">
                退勤
            </button>
        </form>
        <p th:text="${message}"></p>
        <p>＜１つ前の打刻＞</p>
        <div th:if="${latestRecord != null}">
            <p>
                日付：
                <span th:text="${latestRecord.workDate}"></span>
            </p>
            <p>
                出勤：
                <span th:text="${latestRecord.startTime}"></span>
            </p>
        </div>
        <input
                type="hidden"
                id="startNoticeTime"
                th:value="${settings.startNoticeTime}">

        <input
                type="hidden"
                id="endNoticeTime"
                th:value="${settings.endNoticeTime}">
    </main>
</body>
</html>
