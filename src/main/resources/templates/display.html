<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="base :: head('Smart Time Card')">
</head>

<body class="bg-gray-100">

<header th:replace="header :: header">
</header>

<main class="max-w-md mx-auto mt-20 pt-20 text-center">

    <h2 class="text-2xl font-bold mb-4">
        履歴一覧
    </h2>

    <form th:action="@{/display}"
          method="get"
          class="flex gap-2">

        <input
                type="date"
                name="startDate"
                placeholder="開始日"
                th:value="${startDate}"
                class="border rounded px-3 py-2 w-full">
        <input
                type="date"
                name="endDate"
                placeholder="終了日"
                th:value="${endDate}"
                class="border rounded px-3 py-2 w-full">

        <button
                type="submit"
                class="bg-green-600 text-white px-6 py-2 rounded">
            検索
        </button>
    </form>
    <div class="overflow-x-auto">
        <table class="min-w-full my-4 border">
            <thead class="bg-gray-200">
            <tr>
                <th class="border p-2">Id</th>
                <th class="border p-2">勤務日</th>
                <th class="border p-2">出勤</th>
                <th class="border p-2">退勤</th>
                <th class="border p-2">休憩</th>
                <th class="border p-2">勤務形態</th>
                <th class="border p-2">修正</th>
            </tr>

            </thead>

            <tbody>
            <tr th:each="record : ${records}">
                <td class="border p-2" th:text="${record.id}"></td>
                <td class="border p-2" th:text="${record.workDate}"></td>
                <td class="border p-2" th:text="${#temporals.format(record.startTime, 'HH:mm')}"></td>
                <td class="border p-2" th:text="${#temporals.format(record.endTime, 'HH:mm')}"></td>
                <td class="border p-2" th:text="${settings.defaultBreakMinutes}"></td>
                <td class="border p-2" th:text="${record.workType}"></td>
                <td class="border p-2">
                    <form th:action="@{/edit}" method="get">
                        <input
                            type="hidden"
                            name="id"
                            th:value="${record.id}">
                        <button
                                type="submit"
                                class="bg-green-600 text-white px-3 py-1 rounded">
                            修正
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${records == null or #lists.isEmpty(records)}">
                <td colspan="5" class="border p-2 text-center">
                    該当するデータはありません
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
